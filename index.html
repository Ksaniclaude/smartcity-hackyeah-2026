<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c1324" />
    <title>Zdążą? Rynek prognoz o terminach w polskich miastach</title>
    <meta name="description" content="Mieszkańcy prognozują punktami, czy miasta w Polsce dotrzymają terminów. Kurs pokazuje, ile w to wierzą." />
    <script>
      try {
        var m = localStorage.getItem("motyw");
        if (m) document.documentElement.dataset.motyw = m;
        if (m === "jasny") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f2f4f8");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
